

$color = rgba(151316ff)
$inner_color = rgba(211328ff)
$outer_color = rgba(7f4ea2ff)
$font_color = rgba(f9e3dfff)
$check_color = rgba(edaea4ff)

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/.wallpaper/bg-02.png
    blur_passes = 0
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 4

    font_family = JetBrainsMono Nerd Font
    font_color = $font_color

    placeholder_text = Enter Password
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
